name: DevSecOps CI and Terraform Deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository
        uses: gitleaks/gitleaks-action@v2

  terraform:
    name: Terraform Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform -chdir=environments/dev init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir=environments/dev validate

      - uses: terraform-linters/setup-tflint@v4

      - name: TFLint init
        run: tflint --init

      - name: TFLint
        run: tflint --recursive

  checkov:
    name: Checkov IaC Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: python -m pip install checkov

      - name: Scan Terraform
        run: |
          checkov --directory environments/dev --framework terraform
          checkov --directory modules --framework terraform

  python:
    name: Python Validation and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install boto3 ruff

      - name: Python syntax
        run: |
          python -m py_compile applications/ingestion/lambda_function.py
          python -m py_compile applications/glue-jobs/transform.py
          python -m py_compile tests/test_lambda_ingestion.py

      - name: Ruff lint
        run: ruff check applications tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v

  hcp-plan:
    name: HCP Terraform Plan
    runs-on: ubuntu-latest
    needs: [gitleaks, terraform, checkov, python]
    if: github.event_name != 'pull_request'
    steps:
      - name: Trigger and monitor HCP Terraform run
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          TF_WORKSPACE_ID: ${{ secrets.TF_WORKSPACE_ID }}
          TF_ORGANIZATION: ${{ secrets.TF_ORGANIZATION }}
          TF_HOSTNAME: app.terraform.io
        run: python .github/scripts/trigger_hcp_terraform_plan.py

  apply-approval:
    name: Manual Apply Approval
    runs-on: ubuntu-latest
    needs: [hcp-plan]
    if: github.event_name != 'pull_request'
    environment:
      name: production-apply-approval
    steps:
      - name: Approval gate passed
        run: echo "GitHub Environment approval granted. Apply remains manual in HCP Terraform."
